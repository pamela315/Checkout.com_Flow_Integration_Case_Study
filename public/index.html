<!doctype html>
<html lang="en-HK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout — Case Co.</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="successToast" class="toast success" role="status">
      <span>Payment successful</span>
    </div>
    <div id="failedToast" class="toast failed" role="status">
      <span>Payment failed — please try again</span>
    </div>

    <header class="site-header">
      <a class="brand" href="/" aria-label="Case Co. home">
        <img
          class="brand__logo"
          src="./logo.png"
          width="305"
          height="264"
          alt="Case Co."
        />
        <p class="brand__tagline">Good morning, Good afternoon, Goodbye</p>
      </a>
    </header>

    <section
      id="success-panel"
      class="panel success-panel"
      hidden
      aria-live="polite"
      aria-labelledby="success-heading"
    >
      <h2 id="success-heading">Thank you — order received</h2>
      <p class="success-panel__lead">
        Your payment was completed. We will email you when your cases ship.
      </p>
      <dl class="success-panel__meta">
        <div>
          <dt>Payment ID</dt>
          <dd id="success-payment-id">—</dd>
        </div>
        <div>
          <dt>Status</dt>
          <dd id="success-payment-status">Confirming…</dd>
        </div>
      </dl>
    </section>

    <main class="checkout" id="checkout-main">
      <section class="panel" aria-labelledby="order-heading">
        <h1 id="order-heading">Your order</h1>
        <ul id="product-list" class="product-list"></ul>
        <p class="order-total">
          Total
          <strong id="order-total">—</strong>
        </p>
      </section>

      <section class="panel" aria-labelledby="details-heading">
        <h2 id="details-heading">Contact &amp; delivery</h2>
        <form id="customer-form" novalidate>
          <label>
            Full name (required)
            <input name="name" placeholder="John Doe" type="text" autocomplete="name" required />
          </label>
          <label>
            Email (required)
            <input name="email" placeholder="example@example.com" type="email" autocomplete="email" required />
          </label>
          <label>
            Phone (optional)
            <input id="phone-input" name="phone" placeholder="+852 9123 4567" type="tel" autocomplete="tel" />
          </label>
          <label>
            Address line 1 (required)
            <input name="addressLine1" placeholder="123 Main St" type="text" autocomplete="address-line1" required />
          </label>
          <label>
            Address line 2 (optional)
            <input name="addressLine2" placeholder="Apt 1" type="text" autocomplete="address-line2" />
          </label>
          <label>
            City (required)
            <input name="city" type="text" autocomplete="address-level2" required />
          </label>
          <label>
            Country (required)
            <select name="country" autocomplete="country">
              <option value="HK" selected>Hong Kong</option>
              <option value="NL">Netherlands</option>
            </select>
          </label>
          <p id="form-error" class="form-error" hidden></p>
          <button type="submit" id="continue-btn" class="btn-primary">
            Continue to payment
          </button>
        </form>
      </section>

      <section
        class="panel panel-payment"
        id="payment-section"
        hidden
        aria-labelledby="payment-heading"
      >
        <h2 id="payment-heading">Payment</h2>
        <div id="flow-container"></div>
        <p id="session-error" class="form-error" hidden></p>
      </section>
    </main>

    <script src="https://checkout-web-components.checkout.com/index.js"></script>
    <script src="app.js"></script>
  </body>
</html>
